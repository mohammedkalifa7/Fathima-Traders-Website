<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fathima Traders | Admin</title><link rel="stylesheet" href="style.css"></head><body style="background:#f4f6f2">
<nav class="nav"><div class="container navin"><a class="brand" href="/"><span class="mark">F</span><span>Fathima Traders<small>Business Admin</small></span></a><div class="links"><a href="/">Website</a><button class="btn btn-outline" id="logout">Log out</button></div></div></nav>
<section style="padding:35px 0"><div class="container">
<div class="section-head"><div><span class="eyebrow">Private area</span><h1 style="font-family:'Playfair Display',serif">Business dashboard</h1><p>Manage products, enquiries, customers, orders and quotations.</p></div><button class="btn btn-primary" onclick="loadAll()">Refresh</button></div>
<div class="cards" style="grid-template-columns:repeat(5,1fr);margin-bottom:25px">
<div class="quote-box"><small>Enquiries</small><h2 id="statEnq">0</h2></div><div class="quote-box"><small>New</small><h2 id="statNew">0</h2></div><div class="quote-box"><small>Customers</small><h2 id="statCust">0</h2></div><div class="quote-box"><small>Orders</small><h2 id="statOrd">0</h2></div><div class="quote-box"><small>Quotes</small><h2 id="statQuote">0</h2></div>
</div>
<div class="quote-box" style="background:white">
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
<button class="btn btn-primary tab" data-tab="enquiries">Enquiries</button><button class="btn btn-outline tab" data-tab="products">Products</button><button class="btn btn-outline tab" data-tab="customers">Customers</button><button class="btn btn-outline tab" data-tab="orders">Orders</button><button class="btn btn-outline tab" data-tab="quotes">Quotations</button>
</div>
<div id="panel-enquiries"></div><div id="panel-products" hidden></div><div id="panel-customers" hidden></div><div id="panel-orders" hidden></div><div id="panel-quotes" hidden></div>
</div></div></section>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let cache={enquiries:[],products:[],customers:[],orders:[],quotes:[]};
async function api(url,opt={}){let r=await fetch(url,opt);if(r.status===401){location.href='/admin';throw Error('Session expired')}let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function loadAll(){cache.enquiries=await api('/api/admin/enquiries');cache.products=await api('/api/admin/products');cache.customers=await api('/api/admin/customers');cache.orders=await api('/api/admin/orders');cache.quotes=await api('/api/admin/quotations');render();document.querySelector('#statEnq').textContent=cache.enquiries.length;document.querySelector('#statNew').textContent=cache.enquiries.filter(x=>x.status==='New').length;document.querySelector('#statCust').textContent=cache.customers.length;document.querySelector('#statOrd').textContent=cache.orders.length;document.querySelector('#statQuote').textContent=cache.quotes.length}
function render(){
panel('enquiries',`<h3>Customer enquiries</h3><div style="overflow:auto"><table style="width:100%;min-width:950px;border-collapse:collapse"><thead><tr><th>ID</th><th>Buyer</th><th>Product</th><th>Qty</th><th>Destination</th><th>Contact</th><th>Status</th><th>Actions</th></tr></thead><tbody>${cache.enquiries.map(x=>`<tr><td>#${x.id}<br><small>${new Date(x.created_at+'Z').toLocaleString()}</small></td><td><b>${esc(x.name)}</b><br>${esc(x.company)}</td><td>${esc(x.product)}<br><small>${esc(x.message)}</small></td><td>${esc(x.quantity||'—')}</td><td>${esc(x.destination||'—')}</td><td>${esc(x.phone)}<br>${esc(x.email)}</td><td><select onchange="statusEnq(${x.id},this.value)">${['New','Contacted','Quoted','Won','Closed'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn btn-outline" onclick="makeQuote(${x.id})">Create quote</button></td></tr>`).join('')}</tbody></table></div>`);
panel('products',`<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><h3>Product catalogue</h3><button class="btn btn-primary" onclick="addProduct()">+ Add product</button></div><div style="overflow:auto"><table style="width:100%;min-width:900px;border-collapse:collapse"><thead><tr><th>Image</th><th>Product</th><th>Category</th><th>Packaging</th><th>Availability</th><th>Action</th></tr></thead><tbody>${cache.products.map(x=>`<tr><td><img src="${esc(x.image)}" style="width:70px;height:50px;object-fit:cover;border-radius:8px"></td><td><b>${esc(x.name)}</b><br>${esc(x.tamil_name)}</td><td>${esc(x.category)}</td><td>${esc(x.packaging)}</td><td>${esc(x.availability)}</td><td><button class="btn btn-outline" onclick="editProduct(${x.id})">Edit</button> <button class="btn btn-outline" onclick="deleteProduct(${x.id})">Hide</button></td></tr>`).join('')}</tbody></table></div>`);
panel('customers',`<h3>Customers</h3><div style="overflow:auto"><table style="width:100%;min-width:750px;border-collapse:collapse"><thead><tr><th>Name</th><th>Company</th><th>Phone</th><th>Email</th><th>Enquiries</th><th>Last enquiry</th></tr></thead><tbody>${cache.customers.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.company)}</td><td>${esc(x.phone)}</td><td>${esc(x.email)}</td><td>${x.enquiries}</td><td>${esc(x.last_enquiry||'—')}</td></tr>`).join('')}</tbody></table></div>`);
panel('orders',`<div style="display:flex;justify-content:space-between"><h3>Orders</h3><button class="btn btn-primary" onclick="addOrder()">+ Add order</button></div><div style="overflow:auto"><table style="width:100%;min-width:850px;border-collapse:collapse"><thead><tr><th>ID</th><th>Product</th><th>Qty</th><th>Price</th><th>Destination</th><th>Status</th></tr></thead><tbody>${cache.orders.map(x=>`<tr><td>#${x.id}</td><td>${esc(x.product)}</td><td>${esc(x.quantity)}</td><td>${esc(x.price)}</td><td>${esc(x.destination)}</td><td><select onchange="statusOrder(${x.id},this.value)">${['New','Quoted','Order Confirmed','Payment Pending','Processing','Dispatched','Delivered','Cancelled'].map(s=>`<option ${x.status===s?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`);
panel('quotes',`<h3>Quotations</h3><div style="overflow:auto"><table style="width:100%;min-width:900px;border-collapse:collapse"><thead><tr><th>Quote No.</th><th>Product</th><th>Qty</th><th>Price</th><th>Packaging</th><th>Delivery</th><th>Validity</th><th>Date</th></tr></thead><tbody>${cache.quotes.map(x=>`<tr><td><b>${esc(x.quote_no)}</b></td><td>${esc(x.product)}</td><td>${esc(x.quantity)}</td><td>${esc(x.price)}</td><td>${esc(x.packaging)}</td><td>${esc(x.delivery)}</td><td>${esc(x.validity)}</td><td>${esc(x.created_at)}</td></tr>`).join('')}</tbody></table></div>`);
}
function panel(n,h){document.querySelector('#panel-'+n).innerHTML=h}
async function statusEnq(id,status){await api('/api/admin/enquiries/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadAll()}
async function statusOrder(id,status){await api('/api/admin/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});loadAll()}
async function addProduct(){let name=prompt('Product name (English)');if(!name)return;let tamil=prompt('Tamil name');let category=prompt('Category');let image=prompt('Image URL');let desc=prompt('Description');let packaging=prompt('Packaging');await api('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,tamil_name:tamil,category,image,description:desc,packaging})});loadAll()}
async function editProduct(id){let p=cache.products.find(x=>x.id===id);let name=prompt('Product name',p.name);if(!name)return;let image=prompt('Image URL',p.image);let packaging=prompt('Packaging',p.packaging);let availability=prompt('Availability',p.availability);await api('/api/admin/products/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,image,packaging,availability})});loadAll()}
async function deleteProduct(id){if(confirm('Hide this product from the website?')){await api('/api/admin/products/'+id,{method:'DELETE'});loadAll()}}
async function makeQuote(id){let e=cache.enquiries.find(x=>x.id===id);let price=prompt('Price / unit', '');if(price===null)return;let packaging=prompt('Packaging','As discussed');let delivery=prompt('Delivery','As discussed');let validity=prompt('Validity','7 days');let notes=prompt('Notes','');let j=await api('/api/admin/quotations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({enquiry_id:e.id,customer_id:e.customer_id,product:e.product,quantity:e.quantity,price,packaging,delivery,validity,notes})});alert('Quotation created: '+j.quoteNo);loadAll()}
async function addOrder(){let product=prompt('Product');if(!product)return;let quantity=prompt('Quantity');let price=prompt('Price');let destination=prompt('Destination');await api('/api/admin/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({product,quantity,price,destination,status:'New'})});loadAll()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('[id^=panel-]').forEach(p=>p.hidden=true);document.querySelector('#panel-'+b.dataset.tab).hidden=false;document.querySelectorAll('.tab').forEach(x=>x.className='btn btn-outline tab');b.className='btn btn-primary tab'});
document.querySelector('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.href='/admin'};loadAll();
</script></body></html>
