<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Fathima Traders</title><link rel="stylesheet" href="style.css"></head><body style="background:var(--cream)"><div style="min-height:100vh;display:grid;place-items:center;padding:25px"><div class="quote-box" style="width:min(440px,100%);background:white"><div class="brand" style="margin-bottom:25px"><span class="mark">F</span><span>Fathima Traders<small>Secure Admin Portal</small></span></div><h1 style="font-family:'Playfair Display',serif;font-size:36px">Admin sign in</h1><p style="color:var(--muted)">Enter the administrator password to view customer enquiries.</p><div id="err" style="color:#a12626;display:none;margin:12px 0"></div><form id="login"><label>Password</label><input type="password" name="password" required autofocus><button class="btn btn-primary" style="width:100%;margin-top:15px">Sign in</button></form><p style="font-size:12px;color:var(--muted);margin-top:20px">For security, change the default password in your environment configuration before publishing.</p><a href="/" style="font-size:13px;color:var(--green)">← Back to website</a></div></div><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const p=new FormData(e.target);const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.get('password')})});if(r.ok)location.href='/admin';else{const j=await r.json();document.querySelector('#err').textContent=j.error;document.querySelector('#err').style.display='block'}})</script></body></html>
